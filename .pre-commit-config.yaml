repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff formatter
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false

      - id: ruff-check
        name: Ruff linter
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy type checker
        entry: uv run --locked mypy
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest test suite
        entry: uv run --locked pytest
        language: system
        pass_filenames: false